<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>役職ガチャ ギャラリー 🍸</title>
    <style>
      :root {
        --gacha-accent: #e63946;
        --gacha-ink: #2b2b3a;
        --gacha-muted: #666;
        --gacha-panel: #fff7f2;
        --gacha-panel-border: #ffd9c2;
        --gacha-radius: 12px;
      }
      body {
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        margin: 0; padding: 2.5rem 1.5rem 4rem;
        background: linear-gradient(#fff5f5, #ffe3e3);
        color: var(--gacha-ink);
        min-height: 100vh;
      }
      h1 { text-align: center; margin: 0 0 2rem; font-size: 2rem; }
      #tabs {
        position: sticky; top: 0; z-index: 10;
        max-width: 1100px; margin: 0 auto 1.5rem;
        display: flex; gap: 0.5rem; overflow-x: auto;
        padding: 0.5rem 0; scrollbar-width: none;
        background: linear-gradient(#fff5f5, rgba(255, 245, 245, 0.9));
      }
      #tabs::-webkit-scrollbar { display: none; }
      .tab {
        flex: 0 0 auto; cursor: pointer;
        padding: 0.5rem 1rem; border-radius: 999px;
        border: 1px solid var(--gacha-panel-border);
        background: var(--gacha-panel); color: var(--gacha-ink);
        font: inherit; font-size: 0.9rem; font-weight: 700;
        min-height: 44px;
      }
      .tab.is-active { background: var(--gacha-accent); color: #fff; border-color: var(--gacha-accent); }
      .tab__count { font-weight: 400; opacity: 0.75; }
      #gallery {
        max-width: 1100px; margin: 0 auto;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem;
      }
      .card {
        margin: 0; background: var(--gacha-panel);
        border: 1px solid var(--gacha-panel-border);
        border-radius: var(--gacha-radius); overflow: hidden;
        box-shadow: 0 6px 16px rgba(230, 57, 70, 0.1);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(230, 57, 70, 0.18); }
      /* カードは横長。横幅に合わせて全体を表示する（切り抜かない） */
      .card img { width: 100%; height: auto; display: block; }
      figcaption { padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
      .title { font-weight: 800; color: var(--gacha-accent); }
      .name { color: var(--gacha-muted); font-size: 0.9rem; }
      .actions { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .actions a {
        display: inline-flex; align-items: center; gap: 0.35rem;
        padding: 0.4rem 0.85rem; border-radius: 999px;
        text-decoration: none; font-size: 0.85rem; font-weight: 700;
        transition: opacity 0.15s ease;
      }
      .actions a:hover { opacity: 0.8; }
      .tweet { background: #000; color: #fff; }
      .download { background: var(--gacha-accent); color: #fff; }
      .empty { text-align: center; color: var(--gacha-muted); }

      /* 画像は全て 1024x1024。読み込み前もレイアウトを固定して CLS を防ぐ */
      .card img { aspect-ratio: 1; object-fit: cover; }

      @media (max-width: 600px) {
        body { padding: 1.5rem 0.75rem 3rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        #gallery { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        #tabs { gap: 0.4rem; margin-bottom: 0.75rem; }
        .tab { padding: 0.5rem 0.75rem; font-size: 0.8rem; }
        figcaption { padding: 0.5rem; gap: 0.15rem; }
        .title {
          font-size: 0.8rem; line-height: 1.3;
          display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
          overflow: hidden;
        }
        .name { font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions { margin-top: 0.4rem; gap: 0.4rem; flex-wrap: nowrap; }
        .actions a {
          width: 44px; height: 44px; padding: 0;
          justify-content: center; font-size: 1rem;
        }
        .actions__label { display: none; }
      }
    </style>
  </head>
  <body>
    <h1>役職ガチャ ギャラリー 🍸</h1>
    <div id="tabs" role="tablist" aria-label="ガチャ種別"></div>
    <div id="gallery"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
