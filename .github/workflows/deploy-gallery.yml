# ギャラリー本体は Cloudflare に移行した。これは旧URL (GitHub Pages) に
# 転送ページを置くためだけのもので、手動でしか動かない。
name: Deploy redirect site (old GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 新しいギャラリーのURL（https://.../）
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gen-redirect-site.js "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.base_url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/redirect
      - id: deploy
        uses: actions/deploy-pages@v4
